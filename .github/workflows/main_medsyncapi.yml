# Deploys the Express backend (backend/) to the Azure Web App "medsyncapi".
# Runs when something in backend/ (or this file) changes on main, or by hand
# from the Actions tab (workflow_dispatch). Azure runs `npm install` itself
# after the upload because the app setting SCM_DO_BUILD_DURING_DEPLOYMENT=true.
# Docs: https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - medsyncapi

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - '.github/workflows/main_medsyncapi.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Catches syntax errors before anything reaches Azure.
      - name: Check backend syntax
        run: node --check backend/server.js && node --check backend/docker_connect.js

      # Only the backend folder is uploaded (node_modules is not in git).
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FB175DFFD4AD4A34A909BA16000D7526 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3CA2FD359D9444EF938894BCAA0486CE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5EE186A35AAD46C8B4810214DFB96A19 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'medsyncapi'
          slot-name: 'Production'
          package: .
